name: release

# Pushing a tag like v1.0.0 builds the exes from that commit and creates a
# draft release with them; it goes public when someone presses Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet test -c Release
      - run: dotnet publish src/BigPictureTV.App -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}
      - run: dotnet publish src/BigPictureTV.Cli -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}
      - name: Checksums
        shell: bash
        run: cd publish && sha256sum BigPictureTV.exe bptv.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" publish/BigPictureTV.exe publish/bptv.exe publish/SHA256SUMS.txt
          --draft --title "BigPictureTV $GITHUB_REF_NAME" --generate-notes
