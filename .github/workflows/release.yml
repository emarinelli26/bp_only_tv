name: release

# Pushing a tag like v1.0.0, or running this workflow by hand from the Actions
# tab with a version, builds the exes from that commit and creates a draft
# release with them; it goes public when someone presses Publish (which also
# creates the tag when the run was started by hand).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example v1.0.0, or v2.0.0-beta.1 for a test version'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag or input
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Bad version: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # A version with a suffix (v2.0.0-beta.1) is a test version: marked as a
          # pre-release, so GitHub never offers it as the latest one.
          [[ "$TAG" == *-* ]] && echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" || true
      - run: dotnet test -c Release
      - run: dotnet publish src/BigPictureTV.App -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}
      - run: dotnet publish src/BigPictureTV.Cli -c Release -r win-x64 -o publish -p:Version=${{ env.VERSION }}
      - name: Checksums
        shell: bash
        run: cd publish && sha256sum BigPictureTV.exe bptv.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" publish/BigPictureTV.exe publish/bptv.exe publish/SHA256SUMS.txt
          --target "$GITHUB_SHA" --draft $PRERELEASE --title "BigPictureTV $TAG" --generate-notes
