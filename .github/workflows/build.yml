name: build

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release
      - run: dotnet publish src/BigPictureTV.Cli -c Release -r win-x64 -o publish
      - run: dotnet publish src/BigPictureTV.App -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BigPictureTV-win-x64
          path: publish/BigPictureTV.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bptv-win-x64
          path: publish/bptv.exe
      # The navigation extension as the Edge Add-ons store wants it. GitHub
      # zips each artifact on download, so this one downloads as the package
      # itself, with the extension's files at the top (no zip inside a zip).
      - uses: actions/upload-artifact@v4
        with:
          name: tv-menu-extension-store-package
          path: src/BigPictureTV.Core/TvMenu/Extension/
      - uses: actions/upload-artifact@v4
        with:
          name: tv-menu-extension-store-listing
          path: |
            docs/edge-store/logo-300.png
            docs/edge-store/listing.md
